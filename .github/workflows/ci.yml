name: Swift / Apple platforms
on:
  push:
    branches: [main, 'work/three-rooms-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record the Linux environment
        run: |
          mkdir -p build/logs
          cat /etc/os-release | tee build/logs/linux-release.log
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - name: Run core tests
        run: swift test 2>&1 | tee build/logs/core-tests.log
      - name: Check source declarations and room resources
        run: |
          mkdir -p build/logs
          bash scripts/check-state-declarations.sh 2>&1 | tee build/logs/state-declarations.log
          python3 scripts/rooms/verify_rooms.py 2>&1 | tee build/logs/room-resources.log
      - name: Verify the committed Xcode project
        run: |
          python3 scripts/generate-xcodeproj.py 2>&1 | tee build/logs/project-generation.log
          git diff --exit-code -- FluxIPTV.xcodeproj
      - name: Save core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostics-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14

  apple-build:
    # Xcode 16 on macos-15 compiles out the Liquid Glass branch entirely.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            app: FluxIPTV
            products: Debug
            artifact: macOS-unsigned
          - platform: iOS
            app: FluxIPTViOS
            products: Debug-iphonesimulator
            artifact: iOS-simulator-unsigned
          - platform: tvOS
            app: FluxIPTVTV
            products: Debug-appletvsimulator
            artifact: tvOS-simulator-unsigned
    steps:
      - uses: actions/checkout@v4
      - name: Record the Apple toolchain
        run: |
          mkdir -p build/logs
          xcodebuild -version 2>&1 | tee build/logs/xcode-version.log
          xcodebuild -showsdks 2>&1 | tee build/logs/xcode-sdks.log
          xcrun swiftc --version 2>&1 | tee build/logs/swift-version.log
          for sdk in macosx iphonesimulator appletvsimulator; do
            version=$(xcrun --sdk "$sdk" --show-sdk-version)
            if (( ${version%%.*} < 26 )); then
              printf 'SDK %s must be 26 or later to compile Liquid Glass (found %s).\n' "$sdk" "$version" >&2
              exit 1
            fi
          done
      - name: Build ${{ matrix.platform }}
        id: apple_build
        run: bash scripts/build-platforms.sh '${{ matrix.platform }}'
      - name: Exercise the native YouTube session with a local fixture
        if: ${{ !cancelled() && matrix.platform == 'macOS' && steps.apple_build.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/test-youtube-session.sh 2>&1 | tee build/logs/youtube-native-session.log
      - name: Exercise the TV preview with a local native video
        if: ${{ !cancelled() && matrix.platform == 'macOS' && steps.apple_build.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/test-live-preview.sh 2>&1 | tee build/logs/live-preview-native.log
      - name: Render and verify the actual 3D cases
        if: ${{ !cancelled() && matrix.platform == 'macOS' && steps.apple_build.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/test-case-scene.sh 2>&1 | tee build/logs/case-scene-native.log
      - name: Capture the native television and shelf catalogue
        if: ${{ !cancelled() && matrix.platform == 'macOS' && steps.apple_build.outcome == 'success' }}
        timeout-minutes: 8
        run: bash scripts/test-catalog-ui.sh 2>&1 | tee build/logs/catalog-ui-native.log
      - name: Package the unsigned application
        run: |
          app='build/${{ matrix.platform }}/Build/Products/${{ matrix.products }}/${{ matrix.app }}.app'
          test -d "$app"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" 'build/artifacts/FluxIPTV-${{ matrix.artifact }}.zip'
          printf '%s\n' "$GITHUB_SHA" > build/artifacts/COMMIT.txt
          (
            cd build/artifacts
            shasum -a 256 'FluxIPTV-${{ matrix.artifact }}.zip' > 'FluxIPTV-${{ matrix.artifact }}.zip.sha256'
          )
      - name: Save the unsigned application
        uses: actions/upload-artifact@v4
        with:
          name: FluxIPTV-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: build/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save Apple diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-diagnostics-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            build/logs/
            build/results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  source-pack:
    name: Complete source pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package the exact checked-out commit
        id: package
        run: |
          version=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([0-9.]*\);/\1/p' FluxIPTV.xcodeproj/project.pbxproj | sort -u)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          pack_name="FluxIPTV-${version}-Sources.zip"
          mkdir -p build/source-pack
          git archive --format=zip --prefix="FluxIPTV-${version}/" --output="build/source-pack/$pack_name" HEAD
          printf '%s\n' "$commit" > build/source-pack/COMMIT.txt
          (
            cd build/source-pack
            sha256sum "$pack_name" > "$pack_name.sha256"
            sha256sum --check "$pack_name.sha256"
          )
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Save complete sources
        uses: actions/upload-artifact@v4
        with:
          name: FluxIPTV-${{ steps.package.outputs.version }}-sources-${{ github.run_attempt }}
          path: build/source-pack/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
