name: Swift / Apple platforms
on:
  push:
    branches: [main, 'work/three-rooms-*']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - run: bash scripts/check-state-declarations.sh
      - run: swift test
  apple-build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, tvOS]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && xcodebuild -showsdks
      - run: bash scripts/build-platforms.sh '${{ matrix.platform }}'
